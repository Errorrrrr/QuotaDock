name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test.sh
      - run: python3 scripts/test-antigravity-bridge.py
      - run: bash scripts/build-app.sh
